<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img"><title>The dual GH200 node and how T0 uses it</title><defs><marker id="ah-2a78d6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ah-8a8984" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs><rect width="980" height="300" fill="#ffffff"/><rect x="20" y="40" width="460" height="230" rx="12" fill="#f7fafe" stroke="#2a78d6" stroke-width="2"/>
