<text x="490" y="292.0" font-size="11.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Every T0 run: CUDA_VISIBLE_DEVICES=0  numactl --cpunodebind=0 --membind=0   (one GPU, its own CPU and memory)</text></svg>
