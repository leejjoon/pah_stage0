<text x="120" y="250.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">atoms within the cutoff</text>
<text x="120" y="263.6" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">(dashed circle, ~5 Å) are neighbours</text>
<text x="120" y="40.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">positions xᵢ, elements Zᵢ</text>
