<rect x="260" y="85" width="200" height="130" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1.4"/>
<text x="360.0" y="123.2" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">MACE network</text>
<text x="360.0" y="142.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">graph of neighbours →</text>
<text x="360.0" y="156.3" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">equivariant messages</text>
<text x="360.0" y="170.6" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">(&quot;rotate the molecule,</text>
<text x="360.0" y="184.9" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">the outputs rotate too&quot;)</text>
<path d="M462,150 Q487.0,150.0 512,150" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah-52514e)"/>
<rect x="515" y="85" width="170" height="130" rx="8" fill="#f1f0ed" stroke="#8a8984" stroke-width="1.4"/>
<text x="600.0" y="130.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Energy E</text>
<text x="600.0" y="149.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">sum of per-atom</text>
<text x="600.0" y="163.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">energies:</text>
<text x="600.0" y="177.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">E = Σᵢ εᵢ</text>
<path d="M687,150 Q712.0,150.0 737,150" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah-52514e)"/>
<text x="712" y="240.0" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">automatic</text>
<text x="712" y="253.7" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">differentiation</text>
<path d="M712,228 Q712.0,192.0 712,156" fill="none" stroke="#8a8984" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="740" y="85" width="220" height="130" rx="8" fill="#f1f0ed" stroke="#8a8984" stroke-width="1.4"/>
<text x="850.0" y="130.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Forces</text>
<text x="850.0" y="149.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">Fᵢ = −∂E/∂xᵢ</text>
<text x="850.0" y="163.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">→ Newton&#x27;s equations</text>
<text x="850.0" y="177.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">(molecular dynamics)</text>
<text x="490" y="305.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">Trained on DFT calculations; ~DFT accuracy at a tiny fraction of the cost.  T0 uses one published model, MACE-OFF23 small (organic, neutral molecules only).</text></svg>
