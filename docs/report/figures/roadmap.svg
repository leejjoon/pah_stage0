<text x="145.0" y="104.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">Is JAX (jax-md + mace-jax) &gt; 5× faster</text>
<text x="145.0" y="118.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">than PyTorch (ASE + MACE) per</text>
<text x="145.0" y="132.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">molecule at batch 100?  GPU</text>
<rect x="330" y="50" width="240" height="110" rx="8" fill="#f1f0ed" stroke="#8a8984" stroke-width="1.4"/>
<text x="450.0" y="85.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">T0 memo</text>
<text x="450.0" y="104.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">picks the MD software stack</text>
<text x="450.0" y="118.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">(JAX / mixed / PyTorch)</text>
<text x="450.0" y="132.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">with caveats</text>
