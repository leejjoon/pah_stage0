<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img"><title>Where T0 and T0b sit in the project</title><defs><marker id="ah-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker><marker id="ah-8a8984" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8984"/></marker></defs><rect width="980" height="330" fill="#ffffff"/><text x="20" y="28.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">now: first two months (this plan)</text>
