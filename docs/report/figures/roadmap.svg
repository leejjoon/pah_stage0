<text x="145.0" y="223.2" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">T0b: vertical slice</text>
<text x="145.0" y="242.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">every pipeline stage once, on a tiny</text>
<text x="145.0" y="256.3" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">input: 50 spectra → 2,000 mock</text>
<text x="145.0" y="270.6" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">populations → PAHFIT → PySR</text>
<text x="145.0" y="284.9" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">→ Orion Bar.  CPU</text>
<rect x="330" y="190" width="240" height="120" rx="8" fill="#f1f0ed" stroke="#8a8984" stroke-width="1.4"/>
<text x="450.0" y="223.2" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Slice report</text>
<text x="450.0" y="242.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">plumbing works end to end;</text>
<text x="450.0" y="256.3" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">closure test: the search</text>
<text x="450.0" y="270.6" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">rediscovers a known tracer;</text>
