<text x="20" y="30.0" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="600">Container C (CPU only).  Every stage reads and writes one HDF5 file, slice.h5; `make slice` reruns the chain.</text>
<rect x="12" y="400" width="300" height="56" rx="8" fill="#f1f0ed" stroke="#0b0b0b" stroke-width="1.4"/>
<text x="162.0" y="415.9" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">slice.h5</text>
<text x="162.0" y="434.1" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">the single data file, with provenance:</text>
<text x="162.0" y="447.8" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="normal">PAHdb version, commits, seeds, image hash</text>
<text x="340" y="420.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Stages 1–4 are our forward model (synthetic data with known answers).</text>
<text x="340" y="434.3" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Stages 6–8 are the analysis we want to trust.  Stage 9 is the first contact with real data.</text></svg>
