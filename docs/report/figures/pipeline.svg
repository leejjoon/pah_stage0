<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img"><title>The T0b vertical slice, stage by stage</title><defs><marker id="ah-52514e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs><rect width="980" height="470" fill="#ffffff"/><rect x="12" y="60" width="176" height="104" rx="8" fill="#dff4ec" stroke="#1baf7a" stroke-width="1.4" data-key="stage1"/>
<text x="100.0" y="92.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">1  Species</text>
<text x="100.0" y="111.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">25 PAHs × (neutral,</text>
<text x="100.0" y="125.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">cation) = 50</text>
<text x="100.0" y="139.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">species.csv</text>
<text x="100.0" y="180.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">AmesPAHdbPythonSuite</text>
<text x="182" y="76.0" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal">§5.1</text>
<rect x="208" y="60" width="176" height="104" rx="8" fill="#dff4ec" stroke="#1baf7a" stroke-width="1.4" data-key="stage2"/>
<text x="296.0" y="92.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">2  Spectra</text>
<text x="296.0" y="111.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">DFT band lists</text>
<text x="296.0" y="125.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">(cm⁻¹, km/mol)</text>
<text x="296.0" y="139.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">PAHdb v4.00</text>
<text x="296.0" y="180.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">AmesPAHdbPythonSuite</text>
<text x="378" y="76.0" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal">§5.2</text>
<rect x="404" y="60" width="176" height="104" rx="8" fill="#dff4ec" stroke="#1baf7a" stroke-width="1.4" data-key="stage3"/>
<text x="492.0" y="92.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">3  Cascade</text>
<text x="492.0" y="111.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">6 eV photon →</text>
<text x="492.0" y="125.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">emission spectrum,</text>
<text x="492.0" y="139.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">15 cm⁻¹ Gaussian</text>
<text x="492.0" y="180.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">AmesPAHdbPythonSuite</text>
<text x="574" y="76.0" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal">§5.3</text>
<rect x="600" y="60" width="176" height="104" rx="8" fill="#dff4ec" stroke="#1baf7a" stroke-width="1.4" data-key="stage4"/>
<text x="688.0" y="92.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">4  Populations</text>
<text x="688.0" y="111.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">2,000 mixes:</text>
<text x="688.0" y="125.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">size (log-normal) ×</text>
<text x="688.0" y="139.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">ionised fraction f</text>
<text x="688.0" y="180.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">numpy / scipy</text>
<text x="770" y="76.0" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal">§5.4</text>
<rect x="796" y="60" width="176" height="104" rx="8" fill="#dff4ec" stroke="#1baf7a" stroke-width="1.4" data-key="stage5"/>
<text x="884.0" y="92.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">5  Instrument</text>
<text x="884.0" y="111.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">MIRI MRS resolution,</text>
<text x="884.0" y="125.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">+ dust continuum,</text>
<text x="884.0" y="139.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">+ noise (S/N 50)</text>
<text x="884.0" y="180.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">PAHFIT jwst.yaml, astropy</text>
<text x="966" y="76.0" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal">§5.5</text>
<rect x="796" y="250" width="176" height="104" rx="8" fill="#dff4ec" stroke="#1baf7a" stroke-width="1.4" data-key="stage6"/>
<text x="884.0" y="282.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">6  PAHFIT</text>
<text x="884.0" y="301.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">fit all 2,000;</text>
<text x="884.0" y="315.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">band strengths,</text>
<text x="884.0" y="329.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">Monte Carlo errors</text>
<text x="884.0" y="370.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">PAHFIT (classic.yaml)</text>
<text x="966" y="266.0" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal">§5.6</text>
<rect x="600" y="250" width="176" height="104" rx="8" fill="#dff4ec" stroke="#1baf7a" stroke-width="1.4" data-key="stage7"/>
<text x="688.0" y="282.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">7  Features</text>
<text x="688.0" y="301.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">ratios /11.2 or /total;</text>
<text x="688.0" y="315.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">random-forest</text>
<text x="688.0" y="329.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">reference, baselines</text>
<text x="688.0" y="370.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">pandas, scikit-learn</text>
<text x="770" y="266.0" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal">§5.7</text>
<rect x="404" y="250" width="176" height="104" rx="8" fill="#dff4ec" stroke="#1baf7a" stroke-width="1.4" data-key="stage8"/>
<text x="492.0" y="282.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">8  PySR</text>
<text x="492.0" y="301.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">search formulas</text>
<text x="492.0" y="315.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">f = g(ratios);</text>
<text x="492.0" y="329.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">Pareto front</text>
<text x="492.0" y="370.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">PySR → Julia</text>
<text x="574" y="266.0" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal">§5.8–5.9</text>
<rect x="208" y="250" width="176" height="104" rx="8" fill="#dff4ec" stroke="#1baf7a" stroke-width="1.4" data-key="stage9"/>
<text x="296.0" y="282.3" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">9  Orion Bar</text>
<text x="296.0" y="301.1" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">apply to 5 JWST</text>
<text x="296.0" y="315.4" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">template spectra</text>
<text x="296.0" y="329.7" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">(PDRs4All)</text>
<text x="296.0" y="370.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">PAHFIT + formula</text>
<text x="378" y="266.0" font-size="10" fill="#8a8984" text-anchor="end" font-weight="normal">§5.10</text>
