<text x="160" y="65.0" font-size="9.5" fill="#52514e" text-anchor="middle" font-weight="normal">step</text>
<text x="214" y="106.0" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="normal">MACE</text>
<text x="545" y="140.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">orange boxes on the CPU lane: integrator, neighbour list and graph built in Python each step; the GPU idles in between</text>
<text x="20" y="185.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">JAX (b molecules): 1,000 steps compiled into one GPU program (jax.lax.scan)</text>
<text x="115" y="220.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal">CPU (Python)</text>
<line x1="125" y1="232" x2="960" y2="232" stroke="#c9c8c2"/>
<text x="115" y="260.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal">GPU</text>
<line x1="125" y1="272" x2="960" y2="272" stroke="#c9c8c2"/>
<rect x="130" y="205" width="40" height="24" rx="3" fill="#e6f0fc" stroke="#2a78d6"/>
<text x="150" y="221.0" font-size="9.5" fill="#52514e" text-anchor="middle" font-weight="normal">launch</text>
<rect x="172" y="245" width="760" height="24" rx="3" fill="#2a78d6"/>
<text x="552" y="261.0" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="normal">integrator + neighbour edges + MACE for all b molecules, step after step, no return to Python</text>
<text x="545" y="300.0" font-size="10.5" fill="#8a8984" text-anchor="middle" font-weight="normal" font-style="italic">the cost: the program is compiled once per array shape (timed separately), and all molecules must be padded to fixed sizes</text></svg>
