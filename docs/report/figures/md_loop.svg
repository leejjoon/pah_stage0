<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img"><title>Why a compiled MD loop can be faster: who waits for whom</title><defs></defs><rect width="980" height="330" fill="#ffffff"/><text x="20" y="28.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600">PyTorch + ASE (one molecule): every step goes CPU → GPU → CPU</text>
<text x="115" y="65.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal">CPU (Python)</text>
<line x1="125" y1="77" x2="960" y2="77" stroke="#c9c8c2"/>
<text x="115" y="105.0" font-size="11.5" fill="#52514e" text-anchor="end" font-weight="normal">GPU</text>
