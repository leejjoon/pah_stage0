<rect x="666" y="90" width="40" height="24" rx="3" fill="#eb6834"/>
<line x1="664" y1="74" x2="666" y2="90" stroke="#8a8984"/>
<rect x="720" y="50" width="62" height="24" rx="3" fill="#fdebe3" stroke="#eb6834"/>
<rect x="784" y="90" width="40" height="24" rx="3" fill="#eb6834"/>
<line x1="782" y1="74" x2="784" y2="90" stroke="#8a8984"/>
